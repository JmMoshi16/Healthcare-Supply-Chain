<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester - Healthcare Supply Chain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #1a1a1a;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .btn {
            background: #f0481c;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #d63d15;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .token-display {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            margin-top: 1rem;
        }
        .response {
            background: #1a1a1a;
            color: #0f0;
            padding: 1.5rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 1rem;
        }
        .success {
            background: #dcfce7;
            color: #15803d;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Healthcare API Tester</h1>
        <p class="subtitle">Test all API endpoints for medicine stock management</p>

        <!-- Step 1: Get Token -->
        <div class="card">
            <h2>Step 1: Get API Token</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" value="admin@healthcare.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" value="Admin@123">
            </div>
            <button class="btn" onclick="getToken()">Get Token</button>
            <div id="tokenResult"></div>
        </div>

        <!-- Step 2: Test Endpoints -->
        <div class="card">
            <h2>Step 2: Test API Endpoints</h2>
            <div class="grid">
                <button class="btn" onclick="getAllMedicines()" id="btnMedicines" disabled>Get All Medicines</button>
                <button class="btn" onclick="getMedicineStock()" id="btnStock" disabled>Check Medicine Stock</button>
                <button class="btn" onclick="getExpiring()" id="btnExpiring" disabled>Get Expiring Medicines</button>
                <button class="btn" onclick="getLowStock()" id="btnLowStock" disabled>Get Low Stock</button>
            </div>
            <div id="apiResult"></div>
        </div>
    </div>

    <script>
        let apiToken = null;

        async function getToken() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/v1/auth/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    apiToken = data.token;
                    document.getElementById('tokenResult').innerHTML = `
                        <div class="success">✓ Token received successfully!</div>
                        <div class="token-display">
                            <strong>Token:</strong><br>${apiToken}
                        </div>
                    `;
                    
                    // Enable buttons
                    document.getElementById('btnMedicines').disabled = false;
                    document.getElementById('btnStock').disabled = false;
                    document.getElementById('btnExpiring').disabled = false;
                    document.getElementById('btnLowStock').disabled = false;
                } else {
                    document.getElementById('tokenResult').innerHTML = `
                        <div class="error">✗ ${data.message}</div>
                    `;
                }
            } catch (error) {
                document.getElementById('tokenResult').innerHTML = `
                    <div class="error">✗ Error: ${error.message}</div>
                `;
            }
        }

        async function getAllMedicines() {
            try {
                const response = await fetch('/api/v1/medicines', {
                    headers: {'Authorization': 'Bearer ' + apiToken}
                });
                const data = await response.json();
                displayResult('GET /api/v1/medicines', data);
            } catch (error) {
                displayError(error);
            }
        }

        async function getMedicineStock() {
            const medicineId = prompt('Enter Medicine ID (default: 1):', '1');
            if (!medicineId) return;
            
            try {
                const response = await fetch(`/api/v1/medicines/${medicineId}/stock`, {
                    headers: {'Authorization': 'Bearer ' + apiToken}
                });
                const data = await response.json();
                displayResult(`GET /api/v1/medicines/${medicineId}/stock`, data);
            } catch (error) {
                displayError(error);
            }
        }

        async function getExpiring() {
            const days = prompt('Days to check (default: 30):', '30');
            
            try {
                const response = await fetch(`/api/v1/alerts/expiring?days=${days}`, {
                    headers: {'Authorization': 'Bearer ' + apiToken}
                });
                const data = await response.json();
                displayResult(`GET /api/v1/alerts/expiring?days=${days}`, data);
            } catch (error) {
                displayError(error);
            }
        }

        async function getLowStock() {
            const threshold = prompt('Stock threshold (default: 10):', '10');
            
            try {
                const response = await fetch(`/api/v1/alerts/low-stock?threshold=${threshold}`, {
                    headers: {'Authorization': 'Bearer ' + apiToken}
                });
                const data = await response.json();
                displayResult(`GET /api/v1/alerts/low-stock?threshold=${threshold}`, data);
            } catch (error) {
                displayError(error);
            }
        }

        function displayResult(endpoint, data) {
            document.getElementById('apiResult').innerHTML = `
                <div class="success">✓ ${endpoint}</div>
                <div class="response">${JSON.stringify(data, null, 2)}</div>
            `;
        }

        function displayError(error) {
            document.getElementById('apiResult').innerHTML = `
                <div class="error">✗ Error: ${error.message}</div>
            `;
        }
    </script>
</body>
</html>
