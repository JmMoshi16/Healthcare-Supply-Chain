<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification API Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #111827;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .status-box {
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border-left: 4px solid;
        }
        .status-box.loading {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #92400e;
        }
        .status-box.success {
            background: #dcfce7;
            border-color: #10b981;
            color: #065f46;
        }
        .status-box.error {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            margin-right: 1rem;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f9fafb;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }
        .result h3 {
            color: #374151;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .notif-item {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border-left: 4px solid;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        .notif-item.critical { border-color: #ef4444; }
        .notif-item.high { border-color: #f59e0b; }
        .notif-item.medium { border-color: #3b82f6; }
        .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .notif-icon.critical { background: #fee2e2; }
        .notif-icon.high { background: #fef3c7; }
        .notif-icon.medium { background: #dbeafe; }
        .notif-content {
            flex: 1;
        }
        .notif-title {
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.25rem;
        }
        .notif-message {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }
        .notif-time {
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .count-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        pre {
            background: #1f2937;
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .spinner {
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔔 Notification API Test</h1>
        <p class="subtitle">Test if your notification system is working correctly</p>

        <div class="status-box loading" id="statusBox">
            <strong>⏳ Ready to test</strong><br>
            Click the button below to fetch notifications from the API
        </div>

        <button class="btn" onclick="testAPI()">🚀 Test Notification API</button>
        <button class="btn" onclick="location.href='/dashboard'" style="background: linear-gradient(135deg, #10b981, #059669);">
            📊 Go to Dashboard
        </button>

        <div id="result"></div>
    </div>

    <script>
        async function testAPI() {
            const statusBox = document.getElementById('statusBox');
            const resultDiv = document.getElementById('result');
            
            // Show loading
            statusBox.className = 'status-box loading';
            statusBox.innerHTML = '<strong>⏳ Loading...</strong><br>Fetching notifications from API...';
            resultDiv.innerHTML = '<div class="spinner"></div>';
            
            try {
                const response = await fetch('/api/notifications');
                const data = await response.json();
                
                if (data.success) {
                    // Success
                    statusBox.className = 'status-box success';
                    statusBox.innerHTML = `
                        <strong>✅ API Working!</strong><br>
                        Successfully fetched ${data.unread_count} notification(s)
                    `;
                    
                    // Display results
                    let html = '<div class="result">';
                    html += '<h3>📊 API Response</h3>';
                    html += `<div class="count-badge">${data.unread_count} Notifications</div>`;
                    
                    if (data.notifications && data.notifications.length > 0) {
                        html += '<h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Notifications:</h3>';
                        data.notifications.forEach(notif => {
                            html += `
                                <div class="notif-item ${notif.urgency}">
                                    <div class="notif-icon ${notif.urgency}">
                                        ${getIcon(notif.urgency)}
                                    </div>
                                    <div class="notif-content">
                                        <div class="notif-title">${notif.title}</div>
                                        <div class="notif-message">${notif.message}</div>
                                        <div class="notif-time">${notif.time} • ${notif.urgency.toUpperCase()}</div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        html += '<p style="color: #6b7280; margin-top: 1rem;">No notifications found.</p>';
                    }
                    
                    html += '<h3 style="margin-top: 2rem; margin-bottom: 1rem;">Raw JSON Response:</h3>';
                    html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    html += '</div>';
                    
                    resultDiv.innerHTML = html;
                    
                    // Show success message
                    alert(`✅ SUCCESS!\n\nFound ${data.unread_count} notifications.\n\nNow go to the dashboard and click the bell icon (🔔) in the top-right corner to see them!`);
                    
                } else {
                    throw new Error('API returned success: false');
                }
                
            } catch (error) {
                statusBox.className = 'status-box error';
                statusBox.innerHTML = `
                    <strong>❌ Error!</strong><br>
                    ${error.message}
                `;
                
                resultDiv.innerHTML = `
                    <div class="result">
                        <h3>❌ Error Details</h3>
                        <p style="color: #991b1b; margin-bottom: 1rem;">${error.message}</p>
                        <h4 style="margin-bottom: 0.5rem;">Troubleshooting:</h4>
                        <ul style="color: #6b7280; line-height: 1.8; margin-left: 1.5rem;">
                            <li>Make sure you're logged in</li>
                            <li>Check if the server is running</li>
                            <li>Open browser console (F12) for more details</li>
                            <li>Verify database connection</li>
                        </ul>
                    </div>
                `;
            }
        }
        
        function getIcon(urgency) {
            const icons = {
                critical: '🔴',
                high: '🟠',
                medium: '🔵',
                low: '⚪'
            };
            return icons[urgency] || '⚪';
        }
        
        // Auto-run test on page load
        window.addEventListener('load', () => {
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
